name: Review desktop upstream changes

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      detect_only:
        description: Check upstream without preparing or publishing a review branch
        type: boolean
        default: false

permissions: {}

concurrency:
  group: desktop-upstream-sync
  cancel-in-progress: false

env:
  EDUPI_SOURCE_REPOSITORY: PIGU-PPPgu/edupi-desktop
  UPSTREAM_DESKTOP_URL: https://github.com/abcwyc/pi-agent-desktop.git
  SYNC_BRANCH: sync/upstream-desktop

jobs:
  detect:
    if: github.repository == 'PIGU-PPPgu/edupi-desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Check out the EduPi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.EDUPI_SOURCE_REPOSITORY }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Detect new desktop upstream commits
        id: compare
        run: |
          set -euo pipefail
          git remote add upstream-desktop "$UPSTREAM_DESKTOP_URL"
          git remote set-url --push upstream-desktop disabled://read-only-upstream
          git fetch --no-tags upstream-desktop \
            "+refs/heads/main:refs/remotes/upstream-desktop/main"

          upstream_sha="$(git rev-parse refs/remotes/upstream-desktop/main)"
          reviewed_sha="$(node scripts/desktop-upstream-state.mjs get)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [ "$reviewed_sha" = "$upstream_sha" ] || \
            git merge-base --is-ancestor "$upstream_sha" refs/remotes/origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No desktop upstream changes are pending." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -n "$reviewed_sha" ]; then
              git cat-file -e "$reviewed_sha^{commit}"
              git merge-base --is-ancestor "$reviewed_sha" "$upstream_sha" || {
                echo "Desktop upstream history no longer contains reviewed commit $reviewed_sha." >&2
                exit 1
              }
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Desktop upstream commit \`$upstream_sha\` is not in protected \`main\`."
              echo "A tested review branch and PR will be prepared; \`main\` is never pushed directly."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:
    needs: detect
    if: needs.detect.outputs.changed == 'true' && !inputs.detect_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      existing_pr: ${{ steps.existing.outputs.pr_number }}
      remote_branch_sha: ${{ steps.existing.outputs.remote_branch_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - name: Check out the EduPi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.EDUPI_SOURCE_REPOSITORY }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Find the managed review branch and PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          pr_number="$(gh pr list \
            --repo "$EDUPI_SOURCE_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          remote_branch_sha="$(git \
            -c http.https://github.com/.extraheader="$auth_header" \
            ls-remote origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "remote_branch_sha=$remote_branch_sha" >> "$GITHUB_OUTPUT"

          if [ -n "$remote_branch_sha" ]; then
            git -c http.https://github.com/.extraheader="$auth_header" \
              fetch --no-tags origin \
              "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi

      - name: Prepare the review candidate without write credentials
        id: candidate
        env:
          EXISTING_PR: ${{ steps.existing.outputs.pr_number }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          git remote add upstream-desktop "$UPSTREAM_DESKTOP_URL"
          git remote set-url --push upstream-desktop disabled://read-only-upstream
          git fetch --no-tags upstream-desktop \
            "+refs/heads/main:refs/remotes/upstream-desktop/main"
          test "$(git rev-parse refs/remotes/upstream-desktop/main)" = "$UPSTREAM_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$EXISTING_PR" ]; then
            git switch --create "$SYNC_BRANCH" "refs/remotes/origin/$SYNC_BRANCH"
            git merge --no-edit refs/remotes/origin/main
          else
            git switch --create "$SYNC_BRANCH" refs/remotes/origin/main
          fi

          git diff --exit-code refs/remotes/origin/main -- .github/workflows
          git merge --no-commit --no-ff "$UPSTREAM_SHA"

          # Workflow definitions from the public upstream are never placed on
          # the pushed ref: a candidate-controlled `on: push` workflow could
          # otherwise run with repository secrets before PR review.
          git restore --source=refs/remotes/origin/main \
            --staged --worktree -- .github/workflows
          node scripts/desktop-upstream-state.mjs set "$UPSTREAM_SHA"
          git add scripts/desktop-upstream-state.json
          if git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore: merge reviewed desktop upstream"
          elif ! git diff --cached --quiet; then
            git commit -m "chore: preserve EduPi upstream review boundaries"
          fi

          git diff --exit-code refs/remotes/origin/main -- .github/workflows
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install candidate dependencies
        run: npm ci

      - name: Run the full review gate
        run: |
          set -euo pipefail
          npm test
          node_modules/.bin/tsc --noEmit
          npm run lint
          node scripts/verify-release-destinations.mjs

      - name: Require the tested candidate to remain unchanged
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Bundle the gated candidate
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/desktop-upstream-sync.bundle" \
            "refs/heads/$SYNC_BRANCH" ^refs/remotes/origin/main
          git bundle verify "$RUNNER_TEMP/desktop-upstream-sync.bundle"

      - name: Upload the gated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-upstream-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-upstream-sync.bundle
          if-no-files-found: error
          retention-days: 1

  publish-review:
    needs: [detect, prepare]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the EduPi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.EDUPI_SOURCE_REPOSITORY }}
          ref: main
          fetch-depth: 0

      - name: Download the gated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-upstream-sync-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Verify and push only the managed review branch
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          EXPECTED_REMOTE_SHA: ${{ needs.prepare.outputs.remote_branch_sha }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/desktop-upstream-sync.bundle"
          candidate_ref="refs/remotes/gated/$SYNC_BRANCH"

          git bundle verify "$bundle"
          git fetch "$bundle" \
            "refs/heads/$SYNC_BRANCH:$candidate_ref"
          test "$(git rev-parse "$candidate_ref")" = "$EXPECTED_CANDIDATE_SHA"
          git merge-base --is-ancestor refs/remotes/origin/main "$candidate_ref"
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$candidate_ref"
          git diff --exit-code refs/remotes/origin/main "$candidate_ref" -- .github/workflows

          git push \
            --force-with-lease="refs/heads/$SYNC_BRANCH:$EXPECTED_REMOTE_SHA" \
            origin "$candidate_ref:refs/heads/$SYNC_BRANCH"

      - name: Create or update the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          short_sha="${UPSTREAM_SHA:0:12}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pr_number="$(gh pr list \
            --repo "$EDUPI_SOURCE_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          {
            echo "Automated review candidate for upstream \`abcwyc/pi-agent-desktop@$UPSTREAM_SHA\`."
            echo
            echo "The candidate passed \`npm test\`, \`tsc --noEmit\`, \`npm run lint\`,"
            echo "and the EduPi release-destination sentinels before this branch was pushed."
            echo
            echo "Public-upstream \`.github/workflows\` changes are deliberately excluded from this branch."
            echo "Review and port any relevant CI changes separately from trusted protected \`main\`."
            echo
            echo "This workflow never pushes \`main\`, signs an app, creates a release, or dispatches a release workflow."
            echo "Merging still requires human review of EduPi-specific behavior and release boundaries."
            echo
            echo "[Workflow run]($run_url)"
          } > "$RUNNER_TEMP/pr-body.md"

          title="chore: review desktop upstream $short_sha"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$EDUPI_SOURCE_REPOSITORY" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create \
              --repo "$EDUPI_SOURCE_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
