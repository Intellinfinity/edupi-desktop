name: Publish signed desktop release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build all platforms or retry one platform
        type: choice
        default: all
        options: [all, macos, windows, linux]

permissions:
  contents: write

concurrency:
  group: edupi-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(inputs.platform == 'linux' && '["x86_64-unknown-linux-gnu"]' || inputs.platform == 'windows' && '["x86_64-pc-windows-msvc"]' || inputs.platform == 'macos' && '["aarch64-apple-darwin"]' || '["aarch64-apple-darwin","x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc"]') }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' || matrix.target == 'x86_64-pc-windows-msvc' && 'windows-latest' || 'ubuntu-24.04' }}
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CODE_SIGN_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CODE_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CODE_SIGN_CERTIFICATE" ] || [ -n "$CODE_SIGN_CERTIFICATE_PASSWORD" ]; then
            test -n "$CODE_SIGN_CERTIFICATE"
            test -n "$CODE_SIGN_CERTIFICATE_PASSWORD"
            echo "APPLE_CERTIFICATE=$CODE_SIGN_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CODE_SIGN_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$CODE_SIGN_IDENTITY" ]; then
              echo "APPLE_SIGNING_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::macOS is ad-hoc signed; Accessibility and Screen Recording grants may need to be renewed after an update."
          fi
          if [ -n "$NOTARY_APPLE_ID" ] || [ -n "$NOTARY_PASSWORD" ] || [ -n "$NOTARY_TEAM_ID" ]; then
            test -n "$CODE_SIGN_CERTIFICATE"
            test -n "$NOTARY_APPLE_ID"
            test -n "$NOTARY_PASSWORD"
            test -n "$NOTARY_TEAM_ID"
            echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application quality
        run: |
          npm test
          npx tsc --noEmit
          npm run lint
          npm run security:audit

      - name: Read the pinned EduPi Core revision
        id: core
        shell: bash
        run: |
          echo "commit=$(node -p "require('./contracts/edupi-core-compat.json').core_runtime.core_commit")" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned EduPi Core runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: PIGU-PPPgu/edupi
          ref: ${{ steps.core.outputs.commit }}
          path: .edupi-core-runtime
          # Use the repository-scoped read-only deploy key for the private Core
          # checkout. The token fallback keeps public mirrors usable.
          ssh-key: ${{ secrets.EDUPI_CORE_DEPLOY_KEY }}
          token: ${{ secrets.EDUPI_CORE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Preserve Core manifest bytes
        shell: bash
        run: |
          git -C .edupi-core-runtime config core.autocrlf false
          git -C .edupi-core-runtime checkout-index --all --force
          git -C .edupi-core-runtime archive HEAD | tar -x -C .edupi-core-runtime
      - name: Install Core runtime dependencies
        run: npm ci --ignore-scripts --prefix .edupi-core-runtime

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}

      - name: Validate Cargo lockfile
        run: cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml --format-version 1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        env:
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        with:
          owner: PIGU-PPPgu
          repo: edupi-desktop
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: EduPi Desktop v__VERSION__
          releaseBody: |
            EduPi Desktop 自动更新版本（更新包已签名验证）。

            - macOS Apple Silicon DMG
            - Windows x64 安装程序
            - Linux x64 Debian / AppImage
            - 应用内检查、下载、安装并重启更新

            完整变更记录以本次 EduPi 源码版本为准。
            更新签名用于验证安装包来源，不代表 Apple 公证或 Windows 代码签名。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          tauriScript: npx tauri
          args: --verbose --target ${{ matrix.target }} --bundles ${{ runner.os == 'macOS' && 'app,dmg' || runner.os == 'Windows' && 'nsis' || 'deb,appimage' }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: PIGU-PPPgu/edupi-desktop
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release download "v$version" --pattern latest.json --output latest.json --repo "$RELEASE_REPOSITORY"
          RELEASE_VERSION="$version" node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            if (manifest.version !== process.env.RELEASE_VERSION) throw new Error("Wrong updater version");
            for (const platform of ["darwin-aarch64", "windows-x86_64", "linux-x86_64"]) {
              const entry = manifest.platforms?.[platform];
              if (!entry?.signature || !entry.url?.startsWith(`https://github.com/PIGU-PPPgu/edupi-desktop/releases/download/v${manifest.version}/`)) throw new Error(`Missing signed update: ${platform}`);
            }
          '
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber --repo "$RELEASE_REPOSITORY"
          gh release edit "v$version" --draft=false --latest --repo "$RELEASE_REPOSITORY"

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi
