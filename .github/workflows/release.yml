name: Publish signed desktop release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build all platforms or retry one platform
        type: choice
        default: all
        options: [all, macos, windows, linux]

permissions:
  contents: write

concurrency:
  group: edupi-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Create one draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: Intellinfinity/edupi-desktop
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          tag="v$version"
          gh api "repos/$RELEASE_REPOSITORY/releases?per_page=100" > releases.json
          release_count="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' releases.json)"

          if [ "$release_count" -gt 1 ]; then
            echo "::error::Multiple releases already use $tag; consolidate them before retrying."
            exit 1
          fi

          if [ "$release_count" -eq 1 ]; then
            release_id="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' releases.json)"
            release_draft="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .draft' releases.json)"
            release_target="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .target_commitish' releases.json)"
            if [ "$release_draft" != "true" ]; then
              echo "::error::$tag is already published; bump the app version before releasing again."
              exit 1
            fi
            if [ "$release_target" != "$GITHUB_SHA" ]; then
              echo "::error::$tag belongs to $release_target, not this commit $GITHUB_SHA."
              exit 1
            fi
          else
            jq -n \
              --arg tag "$tag" \
              --arg target "$GITHUB_SHA" \
              --arg name "EduPi Desktop v$version" \
              --rawfile body scripts/release-notes.md \
              '{ tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: false }' \
              > release-request.json
            release_id="$(gh api --method POST "repos/$RELEASE_REPOSITORY/releases" --input release-request.json --jq .id)"
          fi

          {
            echo "release_id=$release_id"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(inputs.platform == 'linux' && '["x86_64-unknown-linux-gnu"]' || inputs.platform == 'windows' && '["x86_64-pc-windows-msvc"]' || inputs.platform == 'macos' && '["aarch64-apple-darwin"]' || '["aarch64-apple-darwin","x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc"]') }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' || matrix.target == 'x86_64-pc-windows-msvc' && 'windows-latest' || 'ubuntu-24.04' }}
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CODE_SIGN_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CODE_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          append_env() {
            printf '%s\n' "$1" >> "$GITHUB_ENV"
          }
          test -n "$CODE_SIGN_CERTIFICATE"
          test -n "$CODE_SIGN_CERTIFICATE_PASSWORD"
          test -n "$CODE_SIGN_IDENTITY"
          test -n "$NOTARY_APPLE_ID"
          test -n "$NOTARY_PASSWORD"
          test -n "$NOTARY_TEAM_ID"
          append_env "APPLE_CERTIFICATE=$CODE_SIGN_CERTIFICATE"
          append_env "APPLE_CERTIFICATE_PASSWORD=$CODE_SIGN_CERTIFICATE_PASSWORD"
          append_env "APPLE_SIGNING_IDENTITY=$CODE_SIGN_IDENTITY"
          append_env "APPLE_ID=$NOTARY_APPLE_ID"
          append_env "APPLE_PASSWORD=$NOTARY_PASSWORD"
          append_env "APPLE_TEAM_ID=$NOTARY_TEAM_ID"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application quality
        run: |
          npm test
          npx tsc --noEmit
          npm run lint
          npm run security:audit

      - name: Read the pinned EduPi Core revision
        id: core
        shell: bash
        run: |
          echo "commit=$(node -p "require('./contracts/edupi-core-compat.json').core_runtime.core_commit")" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned EduPi Core runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Intellinfinity/edupi
          ref: ${{ steps.core.outputs.commit }}
          path: .edupi-core-runtime
          # Prefer a repository-scoped read token when organization policy disables deploy keys.
          ssh-key: ${{ secrets.EDUPI_CORE_READ_TOKEN == '' && secrets.EDUPI_CORE_DEPLOY_KEY || '' }}
          token: ${{ secrets.EDUPI_CORE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Preserve Core manifest bytes
        shell: bash
        run: |
          git -C .edupi-core-runtime config core.autocrlf false
          git -C .edupi-core-runtime checkout-index --all --force
          git -C .edupi-core-runtime archive HEAD | tar -x -C .edupi-core-runtime
      - name: Install Core runtime dependencies
        run: npm ci --ignore-scripts --prefix .edupi-core-runtime

      # Core's crash-released writer admission intentionally requires native
      # attestation on Windows. A hosted-runner temporary directory cannot
      # provide that evidence, so Windows verifies the exact paired bundle
      # bytes and manifests here; the separate published-install workflow
      # exercises the real installed application startup.
      - name: Verify paired Core runtime
        if: runner.os != 'Windows'
        env:
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
        run: |
          npm run test:edupi-ambient-today-runtime
          npm run test:edupi-schedule-conflicts-e2
          node scripts/test-edupi-c2-e2.mjs
          node scripts/test-edupi-c3-e2.mjs
          node --test scripts/packaged-core-bundle.test.mjs

      - name: Verify paired Core bundle on Windows
        if: runner.os == 'Windows'
        env:
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
        run: >
          node --test --test-name-pattern
          "bundled validation rejects|external mode still requires"
          scripts/packaged-core-bundle.test.mjs

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}

      - name: Validate Cargo lockfile
        run: cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml --format-version 1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        env:
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
        run: npm run desktop:prepare

      - name: Verify staged desktop runtime
        if: runner.os == 'macOS'
        env:
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
          EDUPI_STAGED_RESOURCES: ${{ github.workspace }}/src-tauri/resources
        run: |
          npm run test:staged-desktop-runtime
          npm run test:staged-schedule-conflicts-runtime
          npm run test:staged-feedback-runtime
          node --test scripts/runtime-model-host-files.test.mjs

      - name: Prepare macOS resource signing keychain
        if: runner.os == 'macOS'
        env:
          CODE_SIGN_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CODE_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/edupi-resource-signing.keychain-db"
          p12="$RUNNER_TEMP/edupi-resource-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf 'EDUPI_RESOURCE_KEYCHAIN_PATH=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CODE_SIGN_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CODE_SIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"

      - name: Sign bundled macOS native resources
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          EDUPI_RESOURCE_KEYCHAIN_PATH: ${{ env.EDUPI_RESOURCE_KEYCHAIN_PATH }}
        run: node scripts/sign-macos-resources.mjs

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
        with:
          owner: Intellinfinity
          repo: edupi-desktop
          releaseId: ${{ needs.release.outputs.release_id }}
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          tauriScript: npx tauri
          args: --verbose --target ${{ matrix.target }} --bundles ${{ runner.os == 'macOS' && 'app,dmg' || runner.os == 'Windows' && 'nsis' || 'deb,appimage' }}

      - name: Verify notarized macOS application and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/EduPi.app"
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/EduPi_*.dmg)
          test -d "$app_path"
          test "${#dmgs[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=2 "${dmgs[0]}"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Clean up macOS resource signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          if [ -n "${EDUPI_RESOURCE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$EDUPI_RESOURCE_KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/edupi-resource-signing.p12"

  manifest:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: Intellinfinity/edupi-desktop
          FEED_BRANCH: updater-feed
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh api "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > release-assets.json

          download_signature() {
            name="$1"
            asset_count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' release-assets.json)"
            if [ "$asset_count" -ne 1 ]; then
              echo "::error::Expected one release asset named $name, found $asset_count."
              exit 1
            fi
            asset_id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' release-assets.json)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id" > "release-assets/$name"
          }

          download_signature 'EduPi_aarch64.app.tar.gz.sig'
          download_signature "EduPi_${RELEASE_VERSION}_amd64.AppImage.sig"
          download_signature "EduPi_${RELEASE_VERSION}_amd64.deb.sig"
          download_signature "EduPi_${RELEASE_VERSION}_x64-setup.exe.sig"

          node scripts/updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --repository "$RELEASE_REPOSITORY" \
            --assets-dir release-assets \
            --assets-json release-assets.json \
            --notes-file scripts/release-notes.md \
            --output latest.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("src-tauri/resources/component-versions.json", "utf8"));
          const desktop = manifest.components?.find((component) => component.id === "pi-agent-desktop");
          if (manifest.appVersion !== process.env.RELEASE_VERSION || desktop?.version !== process.env.RELEASE_VERSION) {
            throw new Error("Committed component manifest does not match the release version");
          }
          NODE

          delete_asset() {
            name="$1"
            gh api "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id" \
              | while read -r asset_id; do
                  [ -z "$asset_id" ] || gh api --method DELETE \
                    "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id"
                done
          }
          delete_asset latest.json
          delete_asset component-versions.json

          gh api --method POST -H 'Content-Type: application/json' --input latest.json \
            "https://uploads.github.com/repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" > /dev/null
          gh api --method POST -H 'Content-Type: application/json' --input src-tauri/resources/component-versions.json \
            "https://uploads.github.com/repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?name=component-versions.json" > /dev/null

          gh api "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > final-assets.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { requiredReleaseAssetNames } from "./scripts/updater-manifest.mjs";
          const assets = JSON.parse(fs.readFileSync("final-assets.json", "utf8"));
          const expected = [...requiredReleaseAssetNames(process.env.RELEASE_VERSION), "component-versions.json", "latest.json"].sort();
          const names = assets.map((asset) => asset.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`Release assets differ: ${names.join(", ")}`);
          NODE

          # Build a one-file Git tree instead of branching from main. Each
          # update is a fast-forward commit whose current tree contains only
          # latest.json; a failed write leaves the release draft untouched.
          feed_parent="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/heads/$FEED_BRANCH" --jq .object.sha 2>/dev/null || true)"
          feed_content="$(base64 --wrap=0 latest.json)"
          feed_blob="$(jq -n --arg content "$feed_content" \
            '{ content: $content, encoding: "base64" }' \
            | gh api --method POST "repos/$RELEASE_REPOSITORY/git/blobs" --input - --jq .sha)"
          jq -n --arg sha "$feed_blob" \
            '{ tree: [{ path: "latest.json", mode: "100644", type: "blob", sha: $sha }] }' \
            > feed-tree-request.json
          feed_tree="$(gh api --method POST "repos/$RELEASE_REPOSITORY/git/trees" \
            --input feed-tree-request.json --jq .sha)"
          if [ -n "$feed_parent" ]; then
            jq -n --arg message "Update updater feed for $RELEASE_TAG" \
              --arg tree "$feed_tree" --arg parent "$feed_parent" \
              '{ message: $message, tree: $tree, parents: [$parent] }' > feed-commit-request.json
          else
            jq -n --arg message "Create updater feed for $RELEASE_TAG" \
              --arg tree "$feed_tree" \
              '{ message: $message, tree: $tree, parents: [] }' > feed-commit-request.json
          fi
          feed_commit="$(gh api --method POST "repos/$RELEASE_REPOSITORY/git/commits" \
            --input feed-commit-request.json --jq .sha)"
          if [ -n "$feed_parent" ]; then
            gh api --method PATCH "repos/$RELEASE_REPOSITORY/git/refs/heads/$FEED_BRANCH" \
              -f sha="$feed_commit" -F force=false > /dev/null
          else
            gh api --method POST "repos/$RELEASE_REPOSITORY/git/refs" \
              -f ref="refs/heads/$FEED_BRANCH" -f sha="$feed_commit" > /dev/null
          fi
          test "$(gh api "repos/$RELEASE_REPOSITORY/git/trees/$feed_tree?recursive=1" \
            --jq '[.tree[] | .path] | join("\n")')" = "latest.json"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/$RELEASE_REPOSITORY/$FEED_BRANCH/latest.json?commit=$feed_commit" \
            -o feed-latest.json
          cmp --silent latest.json feed-latest.json

          # The release job already binds this draft to this commit; do not
          # rewrite target_commitish while publishing the validated assets.
          gh api --method PATCH "repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=false -f make_latest=true \
            --jq '{ tag: .tag_name, draft, prerelease, published_at, assets: (.assets | length) }'

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [release, build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi
