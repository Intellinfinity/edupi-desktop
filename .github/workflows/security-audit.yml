name: Dependency security audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-security-dependencies.mjs"
      - "scripts/dependency-security.test.mjs"
      - "vendor/next-root-glob/**"
      - ".github/dependabot.yml"
      - ".github/workflows/security-audit.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/vendor/**"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-security-dependencies.mjs"
      - "scripts/dependency-security.test.mjs"
      - "vendor/next-root-glob/**"
      - ".github/dependabot.yml"
      - ".github/workflows/security-audit.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/vendor/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Fail on high or critical dependency vulnerabilities
        run: npm run security:audit

      - name: Verify the installed dependency tree
        run: |
          npm ci
          npm ls fast-glob undici brace-expansion --all
          node --test scripts/dependency-security.test.mjs

      - name: Verify application compatibility
        if: github.event_name != 'schedule'
        run: |
          npm test
          node_modules/.bin/tsc --noEmit
          npm run lint

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out EduPi Desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Fail on RustSec advisories
        run: cargo audit --file src-tauri/Cargo.lock
