name: Debug the Windows desktop build

# Manual only, and deliberately not part of any release path: it produces no
# artifacts, creates no release, and signs nothing.
#
# ROOT CAUSE (found 2026-07-26, runs 30203907309 and 30204652244):
#
#   app/api/default-cwd/route.ts does
#       const dir = join(homedir(), `pi-cwd-${date}`);
#       mkdirSync(dir, { recursive: true });
#
#   Next's file tracer (@vercel/nft) statically analyses that fs call. It can
#   evaluate homedir(), but the template literal is dynamic, so it turns the
#   path into a glob and enumerates the base. The two patterns it issued were:
#
#       C:\Users\runneradmin\pi-cwd-*
#       C:\Users\runneradmin/**/*        <- note the mixed separators
#
#   The second walks the entire user profile, which on a Windows runner is full
#   of legacy junctions (Application Data -> AppData\Roaming, Local Settings ->
#   AppData\Local, Cookies, ...) plus WindowsApps reparse points. Enumerating
#   them returns EPERM/EACCES and fails the build.
#
#   The same build on macOS reports ZERO scans outside the checkout, so this is
#   Windows-specific rather than a latent problem everywhere.
#
#   This also explains why 576181f did not help: outputFileTracingRoot bounds
#   where traced output is rooted, not where nft follows an analysed path.
#
# Delete this workflow once the Windows leg is restored in release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Windows version to install
        required: true
      native_only:
        description: Skip the private Core build and check the public installer/native source only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  published-install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install and start published application
        shell: pwsh
        env:
          EDUPI_TEST_RELEASE: ${{ inputs.tag }}
        run: ./scripts/test-windows-installed-release.ps1
      - name: Check native source with public resource fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "edupi-install-check/application/resources"
          if (!(Test-Path $fixture)) { throw "Published resource fixture missing" }
          Copy-Item (Join-Path $fixture "*") -Destination ./src-tauri/resources -Recurse -Force
          $env:TAURI_CONFIG = Get-Content ./src-tauri/tauri.windows.conf.json -Raw
          cargo check --manifest-path src-tauri/Cargo.toml --lib --locked
  diagnose:
    if: ${{ !inputs.native_only }}
    runs-on: windows-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Read the pinned EduPi Core revision
        id: core
        shell: bash
        run: |
          echo "commit=$(node -p "require('./contracts/edupi-core-compat.json').core_runtime.core_commit")" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned EduPi Core runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Intellinfinity/edupi
          ref: ${{ steps.core.outputs.commit }}
          path: .edupi-core-runtime
          # Prefer a repository-scoped read token when organization policy disables deploy keys.
          ssh-key: ${{ secrets.EDUPI_CORE_READ_TOKEN == '' && secrets.EDUPI_CORE_DEPLOY_KEY || '' }}
          token: ${{ secrets.EDUPI_CORE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Preserve Core manifest bytes
        shell: bash
        run: |
          git -C .edupi-core-runtime config core.autocrlf false
          git -C .edupi-core-runtime checkout-index --all --force
          git -C .edupi-core-runtime archive HEAD | tar -x -C .edupi-core-runtime
      - name: Install Core runtime dependencies
        run: npm ci --ignore-scripts --prefix .edupi-core-runtime

      - name: Install dependencies
        run: npm ci

      - name: Describe the environment
        shell: bash
        run: |
          echo "cwd:        $(pwd)"
          echo "node:       $(node --version)"
          echo "HOME:       ${HOME:-unset}"
          echo "USERPROFILE:${USERPROFILE:-unset}"
          echo "homedir:    $(node -p 'require("node:os").homedir()')"
          echo "tmpdir:     $(node -p 'require("node:os").tmpdir()')"

      - name: Show what next.config resolves to
        shell: bash
        run: |
          # outputFileTracingRoot was pinned to __dirname in 576181f; confirm it
          # actually resolves on Windows rather than silently becoming undefined.
          node -e "
            const { createJiti } = require('jiti');
            const jiti = createJiti(process.cwd() + '/');
            const config = jiti('./next.config.ts').default ?? jiti('./next.config.ts');
            console.log(JSON.stringify({
              outputFileTracingRoot: config.outputFileTracingRoot,
              distDir: config.distDir,
              output: config.output,
              serverExternalPackages: config.serverExternalPackages,
            }, null, 2));
          "
        env:
          PI_WEB_DESKTOP_BUILD: "1"

      # desktop:prepare rather than a bare `next build`: it runs the same build
      # and then exercises the Windows-only half of prepare-desktop.mjs — the
      # node.exe copy and the npm lookup — which a plain build never touches.
      # No installer packaging, signing or release.
      - name: Stage the desktop server with a stray-scan tracer attached
        shell: bash
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--require ./scripts/trace-stray-scandir.cjs --stack-trace-limit=60"
          EDUPI_CORE_ROOT: ${{ github.workspace }}/.edupi-core-runtime
        run: npm run desktop:prepare

      - name: Show what got staged
        shell: bash
        continue-on-error: true
        run: |
          echo "--- server entry ---"
          ls -la src-tauri/resources/server/server.js src-tauri/resources/server/desktop-server.cjs
          echo "--- bundled node runtime ---"
          ls -la src-tauri/resources/node/
          "./src-tauri/resources/node/node.exe" --version
          echo "--- bundled pi packages ---"
          for d in src-tauri/resources/server/node_modules/@earendil-works/*/dist; do
            echo "$d: $(find "$d" -mindepth 1 -maxdepth 1 | wc -l) entries"
          done

      - name: Check native desktop commands
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content ./src-tauri/tauri.windows.conf.json -Raw
          cargo check --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Look for junction loops in the profile
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem -Force "$env:USERPROFILE" |
            Where-Object { $_.LinkType } |
            Select-Object Name, LinkType, Target |
            Format-Table -AutoSize
