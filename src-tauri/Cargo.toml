[package]
name = "pi-agent-desktop"
version = "0.3.40"
description = "Desktop shell for Pi Agent"
authors = ["pi-agent-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "pi_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
dunce = "1"
getrandom = "0.3"
libc = "0.2"
nomi-computer = { path = "vendor/nomifun/nomi-computer" }
nomi-config = { path = "vendor/nomifun/nomi-config" }
nomi-tools = { path = "vendor/nomifun/nomi-tools" }
nomi-types = { path = "vendor/nomifun/nomi-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.10.2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-notification = "^2"
tauri-plugin-process = "^2"
tauri-plugin-updater = "^2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# notify-rust 4.18 requires Rust 1.89, above this crate's declared MSRV.
notify-rust = "=4.17.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.7.3"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
