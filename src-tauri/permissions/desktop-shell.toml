[[permission]]
identifier = "allow-open-external-url"
description = "Allows opening http/https/mailto URLs in the system default handler."
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-get-notification-permission-status"
description = "Allows the trusted EduPi WebView to read macOS UserNotifications status."
commands.allow = ["get_notification_permission_status"]

[[permission]]
identifier = "allow-send-reminder-notification"
description = "Allows task reminders with a fixed in-app activation target."
commands.allow = ["send_reminder_notification"]

[[permission]]
identifier = "allow-take-pending-reminder-open"
description = "Allows the trusted WebView to consume bounded native reminder clicks after cold start."
commands.allow = ["take_pending_reminder_open"]

[[permission]]
identifier = "allow-open-path"
description = "Allows opening a local filesystem path with the OS default application."
commands.allow = ["open_path"]

[[permission]]
identifier = "allow-reveal-item-in-dir"
description = "Allows revealing a local filesystem path in the OS file manager."
commands.allow = ["reveal_item_in_dir"]

[[permission]]
identifier = "allow-set-close-quits"
description = "Allows the UI to choose whether closing the window quits or hides."
commands.allow = ["set_close_quits"]

[[permission]]
identifier = "allow-quit-app"
description = "Allows the UI to quit the desktop application."
commands.allow = ["quit_app"]

[[permission]]
identifier = "allow-show-main-window-cmd"
description = "Allows the UI to show and focus the main window."
commands.allow = ["show_main_window_cmd"]

[[permission]]
identifier = "allow-show-openconnector-console"
description = "Allows the main EduPi window to open a capability-free, loopback-only OpenConnector Console window."
commands.allow = ["show_openconnector_console"]

[[permission]]
identifier = "allow-set-ui-theme"
description = "Allows the UI to persist light/dark theme for the next cold start."
commands.allow = ["set_ui_theme"]

[[permission]]
identifier = "allow-get-update-proxy"
description = "Allows the trusted desktop WebView to read the saved update proxy."
commands.allow = ["get_update_proxy"]

[[permission]]
identifier = "allow-set-update-proxy"
description = "Allows the trusted desktop WebView to save a loopback update proxy."
commands.allow = ["set_update_proxy"]

[[permission]]
identifier = "allow-get-edupi-root-status"
description = "Allows the trusted EduPi WebView to inspect the effective Core and data roots."
commands.allow = ["get_edupi_root_status"]

[[permission]]
identifier = "allow-set-edupi-data-root"
description = "Allows the user to choose the canonical EduPi data directory."
commands.allow = ["set_edupi_data_root"]

[[permission]]
identifier = "allow-reset-edupi-data-root"
description = "Allows the user to return EduPi to its managed data directory."
commands.allow = ["reset_edupi_data_root"]

[[permission]]
identifier = "allow-get-desktop-api-token"
description = "Allows the trusted desktop WebView to authorize native-dialog filesystem requests."
commands.allow = ["get_desktop_api_token"]

[[permission]]
identifier = "allow-get-desktop-runtime-status"
description = "Allows the trusted EduPi WebView to read Safe Mode and local mobile bridge status."
commands.allow = ["get_desktop_runtime_status"]

[[permission]]
identifier = "allow-set-mobile-bridge-enabled"
description = "Allows the trusted EduPi WebView to opt the local-only mobile bridge in or out for the next restart."
commands.allow = ["set_mobile_bridge_enabled"]

[[permission]]
identifier = "allow-restart-normal-mode"
description = "Allows the trusted EduPi WebView to restart without the Safe Mode flag."
commands.allow = ["restart_normal_mode"]

[[permission]]
identifier = "allow-computer-use-status"
description = "Allows the trusted EduPi WebView to read desktop-control enablement and OS permission status."
commands.allow = ["computer_use_status"]

[[permission]]
identifier = "allow-computer-use-set-enabled"
description = "Allows the trusted EduPi WebView to enable or disable the opt-in desktop-control executor."
commands.allow = ["computer_use_set_enabled"]

[[permission]]
identifier = "allow-computer-use-emergency-stop"
description = "Allows the trusted EduPi WebView to immediately disable desktop control and invalidate its snapshot."
commands.allow = ["computer_use_emergency_stop"]

[[permission]]
identifier = "allow-computer-use-request-permission"
description = "Allows a direct user gesture in EduPi settings to request macOS Accessibility or Screen Recording permission."
commands.allow = ["computer_use_request_permission"]

[[permission]]
identifier = "allow-computer-use-execute"
description = "Allows the trusted EduPi WebView to request a validated, audited desktop action; Rust still requires a native user confirmation before execution."
commands.allow = ["computer_use_execute"]
